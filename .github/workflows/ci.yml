name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Une nouvelle poussee annule l'execution precedente sur la meme branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '9.12.3'

jobs:
  qualite:
    name: Qualite du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Generer le client Prisma
        run: pnpm prisma generate
        env:
          # URL bidon : "generate" ne se connecte pas, mais la config l'exige.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public

      - name: Verifier le formatage
        run: pnpm format:check

      - name: Analyse statique
        run: pnpm lint

      - name: Verification des types
        run: pnpm typecheck

      - name: Compilation
        run: pnpm build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public

  securite:
    name: Securite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Audit des dependances
        run: pnpm audit --audit-level=high || true

      - name: Recherche de secrets committes
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
