name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Une nouvelle poussee annule l'execution precedente sur la meme branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '9.12.3'

jobs:
  qualite:
    name: Qualite du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Verifier le formatage
        run: pnpm format:check

      - name: Analyse statique
        run: pnpm lint

      - name: Verification des types
        run: pnpm typecheck

      - name: Compilation
        run: pnpm build

  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: '3000'
      JWT_SECRET: secret-de-ci-uniquement-32-caracteres-minimum
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Tests unitaires
        run: pnpm test

      - name: Tests de bout en bout
        run: pnpm test:e2e

  securite:
    name: Securite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Audit des dependances
        run: pnpm audit --audit-level=high

      - name: Recherche de secrets committes
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
